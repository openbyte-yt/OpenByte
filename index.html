<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpebByte</title>
    <meta name="description" content="Excalidraw-style download hub for HardwareCheck, llama.cpp Windows builds, and SmolLM AI model." />
    <meta property="og:title" content="OpebByte" />
    <meta property="og:description" content="Excalidraw-style download hub for HardwareCheck, llama.cpp Windows builds, and SmolLM AI model." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Patrick+Hand&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="canvas-grid">
      <!-- Top Left Logo (Clean without version tag) -->
      <header class="top-logo-container">
        <div class="top-logo">
          <span class="pulsing-dot"></span>
          <span class="top-logo-text font-hand">OpebByte</span>
        </div>
      </header>

      <!-- Main Content Area -->
      <div class="main-wrapper">
        <!-- Centered OpebByte Title -->
        <div class="app-title-container">
          <h1 class="app-title font-hand">OpebByte</h1>
        </div>

        <!-- The Excalidraw Style Window -->
        <section
          aria-label="Project files window"
          id="opebbyte-window"
          class="excalidraw-window"
        >
          <!-- Subtle top accent gradient -->
          <div class="window-accent-strip"></div>

          <!-- Window Header Bar -->
          <div class="window-header">
            <div class="window-controls">
              <div class="window-dot dot-red"></div>
              <div class="window-dot dot-yellow"></div>
              <div class="window-dot dot-green"></div>
              <span class="window-header-title font-hand">Project Downloads</span>
            </div>
          </div>

          <!-- Window Body: The Three Clean Main Cards -->
          <div class="window-body">
            <!-- ITEM 1: HardwareCheck (Software in .zip) -->
            <div
              id="card-hwcheck"
              class="project-card card-purple"
              title="Click to download HardwareChecker.zip"
            >
              <div class="card-left">
                <div class="card-icon-box">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="4 17 10 11 4 5"></polyline>
                    <line x1="12" x2="20" y1="19" y2="19"></line>
                  </svg>
                </div>
                <div class="card-text-box">
                  <span class="card-tag">ZIP</span>
                  <h2 class="card-title font-hand">HardwareCheck</h2>
                </div>
              </div>

              <div class="card-actions">
                <button
                  id="btn-copy-hardware-check"
                  type="button"
                  class="icon-action-btn"
                  title="Copy direct download link"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect>
                    <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
                  </svg>
                </button>
                <button
                  id="btn-download-hardware-check"
                  type="button"
                  class="primary-action-badge badge-purple font-hand"
                  title="Download HardwareChecker.zip"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" x2="12" y1="15" y2="3"></line>
                  </svg>
                  <span>Download</span>
                </button>
              </div>
            </div>

            <!-- ITEM 2: llama cpp (Windows) -> Opens Popup Modal -->
            <div
              id="card-llama"
              class="project-card card-amber"
              title="Click to select llama.cpp Windows build"
            >
              <div class="card-left">
                <div class="card-icon-box">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                  </svg>
                </div>
                <div class="card-text-box">
                  <span class="card-tag">WINDOWS</span>
                  <h2 class="card-title font-hand">llama cpp (Windows)</h2>
                </div>
              </div>

              <div class="card-actions">
                <button
                  id="btn-open-llama-builds-modal"
                  type="button"
                  class="primary-action-badge badge-amber font-hand"
                  title="Open builds selector"
                >
                  <span>Select Build</span>
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                  </svg>
                </button>
              </div>
            </div>

            <!-- ITEM 3: SmolLM - AI model (.gguf) -->
            <div
              id="card-smollm"
              class="project-card card-green"
              title="Click to download SmolLM2.gguf"
            >
              <div class="card-left">
                <div class="card-icon-box">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 8V4H8"></path>
                    <rect width="16" height="12" x="4" y="8" rx="2"></rect>
                    <path d="M2 14h2"></path>
                    <path d="M20 14h2"></path>
                    <path d="M15 13v2"></path>
                    <path d="M9 13v2"></path>
                  </svg>
                </div>
                <div class="card-text-box">
                  <span class="card-tag">GGUF</span>
                  <h2 class="card-title font-hand">SmolLM - AI model</h2>
                </div>
              </div>

              <div class="card-actions">
                <button
                  id="btn-copy-smollm"
                  type="button"
                  class="icon-action-btn"
                  title="Copy direct GGUF download link"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect>
                    <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
                  </svg>
                </button>
                <button
                  id="btn-download-smollm"
                  type="button"
                  class="primary-action-badge badge-green font-hand"
                  title="Download SmolLM2.gguf"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" x2="12" y1="15" y2="3"></line>
                  </svg>
                  <span>Download</span>
                </button>
              </div>
            </div>
          </div>
        </section>

        <!-- Footer -->
        <footer class="app-footer font-hand">
          <p>OpebByte</p>
        </footer>
      </div>
    </main>

    <!-- Llama.cpp Windows Builds Popup Modal -->
    <div
      id="llama-modal"
      class="modal-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
    >
      <div class="modal-content">
        <!-- Accent strip -->
        <div class="window-accent-strip"></div>

        <!-- Modal Header -->
        <div class="modal-header">
          <div class="modal-title-group">
            <div class="window-controls">
              <div class="window-dot dot-red" id="dot-close-modal" style="cursor: pointer;" title="Close"></div>
              <div class="window-dot dot-yellow"></div>
              <div class="window-dot dot-green"></div>
            </div>
            <h2 id="modal-title" class="modal-title font-hand">llama cpp (Windows) Builds</h2>
            <span id="modal-release-tag" class="modal-tag">Tag: b10992</span>
          </div>

          <div class="modal-header-actions">
            <a
              href="https://github.com/ggml-org/llama.cpp/releases"
              target="_blank"
              rel="noopener noreferrer"
              class="modal-link font-hand"
              title="Open GitHub Releases"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 3h6v6"></path>
                <path d="M10 14 21 3"></path>
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              </svg>
              <span>GitHub Releases</span>
            </a>
            <button id="btn-close-modal" class="modal-close-btn" title="Close window">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- Filter / Search Bar -->
        <div class="modal-filter-bar">
          <div class="filter-input-wrapper">
            <svg class="filter-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input
              id="search-builds"
              type="text"
              class="filter-input"
              placeholder="Filter builds (e.g. CPU, CUDA, Vulkan, OpenVINO, ROCm, ARM64)..."
            />
          </div>
          <span id="filter-count" class="filter-count">10 builds</span>
        </div>

        <!-- Builds List -->
        <div id="llama-builds-list" class="modal-list"></div>

        <!-- Modal Footer -->
        <div class="modal-footer font-hand">
          <span>Binaries sourced directly from official ggml-org/llama.cpp releases</span>
          <button id="btn-done-modal" type="button" class="btn-done">Done</button>
        </div>
      </div>
    </div>

    <!-- Pure JavaScript Application Script -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
